<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- 外框：圆角矩形，紫渐变 -->
  <rect width="64" height="64" rx="14" fill="url(#wbGrad)" />

  <!-- 书本打开：两页展开，表达知识库 -->
  <!-- 左页 -->
  <path d="M14 18 L14 46 L32 50 L32 22 Z" fill="white" opacity="0.9"/>
  <!-- 右页 -->
  <path d="M50 18 L50 46 L32 50 L32 22 Z" fill="white" opacity="0.75"/>
  <!-- 书脊 -->
  <path d="M32 22 L32 50" fill="none" stroke="white" stroke-width="2"/>

  <!-- 书页上的字母 W（词汇） -->
  <text x="24" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#6366f1" text-anchor="middle">W</text>
  <text x="40" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a855f7" text-anchor="middle">W</text>
</svg>
